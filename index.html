a{color:#FF2D3D}a:hover{color:#FFFFFF}

@keyframes dropIn{from{opacity:0;transform:translateY(-16px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(320%) skewX(-20deg)}}

.ring{animation:spinSlow 40s linear infinite}
.track{animation:marquee 32s linear infinite}

.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}

.fl{animation:bob 6s ease-in-out infinite;transition:border-color .3s}

.w1{animation-delay:-1s}.w2{animation-delay:-2.5s}.w3{animation-delay:-4s}.w4{animation-delay:-5.2s}

}
.card{position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s}

      linkLabel: isAcc ? 'Email or WhatsApp for delivery' : 'Your account / channel link',
      linkPlaceholder: isAcc ? 'you@email.com' : 'https://...',
      waOrder: 'https://wa.me/' + WA + '?text=' + encodeURIComponent(lines.join('\n')),
      closeCheckout: function () { self.setState({ sel: null }); },
      inc: function () { self.setState({ qty: Math.min(st.qty + 1, 20) }); },
      dec: function () { self.setState({ qty: Math.max(st.qty - 1, 1) }); },
      onName: function (e) { self.setState({ name: e.target.value }); },
      onLink: function (e) { self.setState({ link: e.target.value }); },
      onNote: function (e) { self.setState({ note: e.target.value }); }
    };
  }
}

render(html`<${Component} />`, document.getElementById('app'));
</script>
</body>
</html>
